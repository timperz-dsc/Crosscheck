# yaml-language-server: $schema=../schema/profile.schema.json
# Fenix A320 profile, format 1. Hand-written entries come from what our own spikes and the
# CRO-8 step 2 probe proved. The generated block comes from tools/profile-gen (the scan plus
# overrides.yaml); never edit it by hand.
format: 1

aircraft:
  id: fenix-a320
  name: Fenix A320
  match:
    # The sim reported "FenixA320 IAE WF" in CRO-8 step 2; the glob covers other liveries.
    titles: ["FenixA320*"]
    packages: [fnx-aircraft-320]
  builds: ["3.0.0.7613"]

groups:
  [overhead, fcu, efis, mip, pedestal, cdu1, cdu2, ecam, cb, flightcontrols, cabin, systems, ground]

# Names the pilots see in the UI.
group_labels:
  overhead: Overhead
  fcu: FCU
  efis: EFIS
  mip: Main panel
  pedestal: Pedestal
  cdu1: CDU 1
  cdu2: CDU 2
  ecam: ECAM
  cb: Circuit breakers
  flightcontrols: Flight controls
  cabin: Cabin
  systems: Systems
  ground: Ground and doors

# The session panel (CRO-34) shows one line per control. A lamp is shown under its button (verify)
# and a display under its knob (display) without saying so here; these are the controls made of
# several knobs or buttons, with the names the pilots see.
controls:
  rmp1_freq: RMP 1 frequency
  rmp2_freq: RMP 2 frequency
  rmp3_freq: RMP 3 frequency
  efis1_nd_filter: ND filter (Capt)
  efis2_nd_filter: ND filter (F/O)
  ecam_page: ECAM page

# Order of the red lines (CRO-34): 2 flight-critical, 3 other overhead systems, 4 pedestal and
# radios, 5 lights, cabin and the rest. Safety lines (not mirrored, stuck pressed, released) are 1.
group_priority:
  fcu: 2
  efis: 2
  cdu1: 2
  cdu2: 2
  mip: 2
  flightcontrols: 2
  overhead: 3
  systems: 3
  pedestal: 4
  ecam: 4
  cb: 5
  cabin: 5
  ground: 5

# Walkaround items: a difference there is one amber "outside" line, never red (CRO-34).
outside_groups: [ground]

# Vars that do not belong to the aircraft at all (GSX, Chaseplane, other aircraft,
# HUES mods, docking guidance). Aircraft-related leftovers (A320_*, ...) are not
# excluded: CRO-8 classifies them, mostly as `ignore`.
exclude:
  - "FSDT_*"
  - "p42_*"
  - "A310_*"
  - "H145_*"
  - "HUES_*"
  - "hues_*"
  - "SAFEGATE_*"
  - "safegate_*"
  - "rlg_*"
  - "agnis_*"
  - "APIS_*"

vars:
  # verified: absolute value, read back from the own L: var, effect from another source.
  - name: S_OH_ELEC_APU_MASTER
    label: APU master
    value_labels: { "0": OFF, "1": ON }
    class: verified
    group: overhead
    values: [0, 1]
    verify: { lvar: I_OH_ELEC_APU_MASTER_L, settle_ms: 150 }
    note: Values [0,1] and the effect lamp confirmed in CRO-8 step 2.

  # 5-position rotary. GraphQL mirrors it with the same numbers (GRAPHQL.md).
  # Labels: read on the FO ND for every value in CRO-8 step 2; captain spot-checked MODE 3 = ARC.
  - name: S_FCU_EFIS1_ND_MODE
    label: ND mode (Capt)
    value_labels: { "0": ROSE ILS, "1": ROSE VOR, "2": ROSE NAV, "3": ARC, "4": PLAN }
    class: verified
    group: efis
    values: [0, 1, 2, 3, 4]
    verify: { graphql: system.switches.S_FCU_EFIS1_ND_MODE, settle_ms: 100 }

  # delta: write the change only, never the absolute value. N_FCU_ALTITUDE shows the result.
  # Never corrected; the display is compared only while the FCU is powered (gate test 2 cause F).
  - name: E_FCU_ALTITUDE
    label: FCU ALT
    class: delta
    group: fcu
    display: N_FCU_ALTITUDE
    compare_when: { powered: B_FCU_POWER }

  # FCU power (0 = unpowered): hand-written because E_FCU_ALTITUDE above refers to it.
  - name: B_FCU_POWER
    label: "FCU power"
    class: observe
    group: fcu
    note: "label generated"

  # pulse, press edge: Fenix counts +1 on press and +1 on release (odd = down). Each edge is
  # mirrored as it happens; the receiver writes its own value + 1 (observe-report.md, CRO-29).
  # Key to screen takes ~25-120 ms inside Fenix.
  - name: S_CDU1_KEY_FPLN
    label: MCDU F-PLN (Capt)
    class: pulse
    group: cdu1
    press: edge
    verify: { mcdu: 1, settle_ms: 600 }

  # analog: 0.0 to 1.0 in the L: var, confirmed by read-back of the L: var itself.
  # No GraphQL check: system.analog.* did not follow value x 1024 in gate test 1 (scale: CRO-28).
  - name: A_OH_PNEUMATIC_COCKPIT_TEMP
    label: Cockpit temperature
    class: analog
    group: overhead
    range: [0, 1]

  # observe: never written, compared between the sims as a desync alarm.
  - name: I_MIP_GEAR_1_L
    label: Gear indicator
    class: observe
    group: mip

  - name: N_FCU_ALTITUDE
    label: FCU altitude display
    class: observe
    group: fcu

  - name: I_OH_ELEC_APU_MASTER_L
    label: APU master light
    class: observe
    group: overhead

  # Sidestick takeover pushbuttons (see roles.takeover). They count like every Fenix push button
  # (+1 on press and release, odd = held; observe-report.md, CRO-29). No verify: the priority
  # arrow lights only after ~2 s held. A press is never written into the flying pilot's sim:
  # the pilot monitoring's press is held back until control is granted (docs/protocol.md section 8).
  - name: S_FC_CAPT_INST_DISCONNECT
    label: "Captain's takeover button"
    class: pulse
    group: flightcontrols
    press: edge

  - name: S_FC_FO_INST_DISCONNECT
    label: "First officer's takeover button"
    class: pulse
    group: flightcontrols
    press: edge


