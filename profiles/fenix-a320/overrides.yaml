open:
  - what: "Audio SEND keys"
    vars: [S_ASP2_CAB_SEND, S_ASP2_HF_1_SEND]
    why: "radio group (one deselects another); needs group handling before sync"
  - what: "BKUP SPD ALT"
    vars: [S_MIP_BKUP_SPD_ALT_CAPT, S_MIP_BKUP_SPD_ALT_FO]
    why: "lit the same autoland lamps as AUTOLAND; AUTOLAND is a +1/+1 push button (positions run), BKUP SPD ALT was not clicked"
  - what: "FCU knob push/pull in flight"
    vars: [S_FCU_SPEED, S_FCU_HEADING, S_FCU_ALTITUDE, S_FCU_VERTICAL_SPEED]
    why: "synced as counters since the write test 2026-11-03 (only SPD write-tested, at the gate). Gate test 3 checks a pull and a push of each knob in both cockpits; the gate test 2 prep run saw a push as -1 held while the mouse was down, so a long press must mirror as -1, then +1"
  - what: "Not moved in the positions run"
    vars: [S_XPDR_OPERATION, S_WR_GAIN, S_MIP_ISFD_LS, S_TCAS_HORIZONTAL_RANGE, S_OH_EXT_LT_LANDING_BOTH, S_MIP_CLOCK_SET, S_FC_FLAPS_LATCH]
    why: "kept as they were (S_XPDR_OPERATION: values from gate test 1); learn in CRO-24"
  - what: "Push buttons without evidence"
    vars: [S_FC_THR_INST_DISCONNECT1, S_FC_THR_INST_DISCONNECT2]
    why: "the overhead latches showed that a button family is not always a counter: these wait for a click each (CRO-24); the RMP keys and AUTO BRK MED/MAX were clicked in the positions run 2026-11-03"
  - what: "Position counts"
    why: "switches with `# positions to be learned (CRO-24)` have only the values seen; learn the rest from real pilot input (CRO-24)"
  - what: "Encoders without display"
    vars: [E_MIP_CLOCK_SET, E_MIP_TRAFFIC_CAPT, E_MIP_TRAFFIC_FO, E_STANDBY_ALT_IMPERIAL_BARO, E_STANDBY_ALT_METRIC_BARO, E_PED_RMP3_OUTER]
    why: "verified by read-back only, not compared between the sims"
  - what: "RMP 3 outer knob"
    vars: [E_PED_RMP3_OUTER]
    why: "-1 was not accepted at the gate; check in the gate test (CRO-22)"
  - what: "Audio latch vs key"
    why: "gate test 1: a click on a REC key moves its _LATCH, a click on VOICE moves only the key (now a pulse). Other keys unchecked"
  - what: "345 breakers"
    why: "semantics unverified; no saved GraphQL data for them. Follow-up: a read-only GraphQL read of all 356 system.switches.E_CB_* fields in the sim (no writes)"
  - what: "Standby instruments"
    vars: [N_STANDBY_ATTITUDE_BANK, N_STANDBY_ATTITUDE_PITCH, N_STANDBY_COMPASS]
    why: "noise sample unclear; stay observe"
  - what: "Lamp half"
    vars: [S_OH_CARGO_SMOKE_AFT, S_OH_CARGO_SMOKE_FWD, S_OH_PNEUMATIC_CARGO_FWD_ISOL_VALVE]
    why: "neither lamp half changed at the gate; lower-half rule kept"
  - what: "Unconfirmed [0,1] guesses"
    why: "switches with the note 'confirm in step 2': the probe skipped them (deny list, safety skip) or saw no effect at the gate; see probe-report.md"
  - what: "Analog GraphQL scale (CRO-28)"
    why: "system.analog.* did not follow value x 1024 (LDG ELEV read ~200-250 for 0…1); analog entries are confirmed by L: var read-back only until calibrated"
  - what: "Aircraft title"
    why: "match.titles is the glob FenixA320* from one observed title (FenixA320 IAE WF); confirm with other liveries"
