# Vars the automated probe (CRO-8 step 2) must never write. Generated by tools/profile-gen.
# These vars stay in profile.yaml: pilots must be able to sync them. Only the probe skips them.
# Patterns are globs (* any characters, ? one character, case-sensitive), same as `exclude`.
# cover_allowed: true = a var ending in _Cover is NOT denied by this pattern.
format: 1

deny:
  - pattern: "S_OH_FIRE_*"
    reason: "fire buttons, extinguisher agents and fire tests (covers too)"
  - pattern: "S_OH_ELEC_IDG*"
    reason: "IDG disconnect; only the cover may be probed (cover tested in phase 0)"
    cover_allowed: true
  - pattern: "S_ENG_MASTER_*"
    reason: "ENG MASTER"
  - pattern: "S_ENG_MODE"
    reason: "engine mode selector"
  - pattern: "S_OH_ENG_MANSTART_*"
    reason: "ENG MAN START (covers too)"
  - pattern: "S_OH_EVAC_*"
    reason: "EVAC, evacuation horn and captain/purser (covers too)"
  - pattern: "S_OH_OXYGEN_MASK_MAN_ON*"
    reason: "oxygen MAN ON (cover too)"
  - pattern: "S_OXYGEN_MASK_*"
    reason: "crew oxygen mask box and mask test"
  - pattern: "S_OH_PNEUMATIC_DITCHING*"
    reason: "DITCHING (cover too)"
  - pattern: "S_OH_HYD_RAT_MAN_ON"
    reason: "RAT MAN ON; the cover is not matched, so it stays probeable"
  - pattern: "S_MIP_GEAR"
    reason: "gear lever"
  - pattern: "S_MIP_PARKING_BRAKE"
    reason: "parking brake"
  - pattern: "S_OH_ELEC_EMER_GEN_*"
    reason: "emergency generator test and MAN ON (covers too)"
  - pattern: "*DISC*"
    reason: "disconnect (IDG, sidestick takeover, cargo): when in doubt deny"
    cover_allowed: true
  - pattern: "*EMER*"
    reason: "emergency: when in doubt deny"
    cover_allowed: true
  - pattern: "*GUARD*"
    reason: "guarded: when in doubt deny"
    cover_allowed: true
  - pattern: "S_OH_FLT_CTL_*"
    reason: "flight control computers ELAC/SEC/FAC (extra, beyond the brief)"
  - pattern: "S_OH_ENG_N1_MODE_*"
    reason: "engine N1 mode (extra, beyond the brief)"
  - pattern: "S_OH_AFT_FADEC_GND_*"
    reason: "FADEC ground power (extra, beyond the brief)"
  - pattern: "S_OH_ELT_*"
    reason: "emergency locator transmitter (extra, beyond the brief)"

# E_CB_*: all breakers stay in the profile. Only these may be probed (ground, powered, restored at once).
# Picked by position from each panel; the scan cannot say which circuit a breaker protects.
probe_allow:
  breakers:
    - E_CB_105VU_A01
    - E_CB_106VU_B03
    - E_CB_121VU_M19
    - E_CB_121VU_P20
    - E_CB_122VU_W02
    - E_CB_122VU_Y06
    - E_CB_123VU_AB09
    - E_CB_2000VU_J06
    - E_CB_2001VU_A03
    - E_CB_49VU_D02
    - E_CB_49VU_G02
