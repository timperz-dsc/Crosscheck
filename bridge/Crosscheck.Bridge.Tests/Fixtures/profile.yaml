# yaml-language-server: $schema=../../../profiles/schema/profile.schema.json
# Test fixture for the bridge tests: the Fenix A320 starter profile from before CRO-8
# (git 0caec65^), plus edge push buttons and an encoder without display. Test data, not the
# real profile: changes to profiles/fenix-a320/profile.yaml never break the bridge tests.
format: 1

aircraft:
  id: fenix-a320
  name: Fenix A320
  match:
    # TODO(CRO-8): add `titles:` once the title the sim reports for the Fenix is recorded.
    packages: [fnx-aircraft-320]
  builds: ["3.0.0.7613"]

groups:
  [overhead, fcu, efis, mip, pedestal, cdu1, cdu2, ecam, cb, flightcontrols, cabin, systems]

# Names the pilots see in the UI.
group_labels:
  overhead: Overhead
  fcu: FCU
  efis: EFIS
  mip: Main panel
  pedestal: Pedestal
  cdu1: CDU 1
  cdu2: CDU 2
  ecam: ECAM
  cb: Circuit breakers
  flightcontrols: Flight controls
  cabin: Cabin
  systems: Systems

# Vars that do not belong to the aircraft at all (GSX, Chaseplane, other aircraft,
# HUES mods, docking guidance). Aircraft-related leftovers (A320_*, ...) are not
# excluded: CRO-8 classifies them, mostly as `ignore`.
exclude:
  - "FSDT_*"
  - "p42_*"
  - "A310_*"
  - "H145_*"
  - "HUES_*"
  - "hues_*"
  - "SAFEGATE_*"
  - "safegate_*"
  - "rlg_*"
  - "agnis_*"
  - "APIS_*"

vars:
  # verified: absolute value, read back from the own L: var, effect from another source.
  - name: S_OH_ELEC_APU_MASTER
    label: APU MASTER
    value_labels: { "0": OFF, "1": ON }
    class: verified
    group: overhead
    values: [0, 1]
    verify: { lvar: I_OH_ELEC_APU_MASTER_L, settle_ms: 150 }
    note: Effect lamp is not proven yet, confirm in CRO-8.

  # 5-position rotary. GraphQL mirrors it with the same numbers (GRAPHQL.md).
  - name: S_FCU_EFIS1_ND_MODE
    label: Captain ND mode
    class: verified
    group: efis
    values: [0, 1, 2, 3, 4]
    verify: { graphql: system.switches.S_FCU_EFIS1_ND_MODE, settle_ms: 100 }

  # delta: write the change only, never the absolute value. N_FCU_ALTITUDE shows the result.
  - name: E_FCU_ALTITUDE
    label: FCU altitude
    class: delta
    group: fcu
    display: N_FCU_ALTITUDE

  # pulse, press edge: Fenix counts +1 on press and +1 on release (odd = down, CRO-29).
  - name: S_CDU1_KEY_FPLN
    label: CDU 1 F-PLN
    class: pulse
    group: cdu1
    press: edge
    verify: { mcdu: 1, settle_ms: 600 }

  # Test data: a momentary key (1, then 0 after pulse_ms), the default press mode.
  - name: S_CDU1_BRIGHTNESS_UP
    label: CDU 1 BRT
    class: pulse
    group: cdu1
    pulse_ms: 150

  # analog: 0.0 to 1.0 in the L: var; GraphQL shows value x 1024.
  - name: A_OH_PNEUMATIC_COCKPIT_TEMP
    label: Cockpit temperature
    class: analog
    group: overhead
    range: [0, 1]
    verify: { graphql: system.analog.A_OH_PNEUMATIC_COCKPIT_TEMP, scale: 1024, settle_ms: 100 }

  # observe: never written, compared between the sims as a desync alarm.
  - name: I_MIP_GEAR_1_L
    label: Gear indicator
    class: observe
    group: mip

  - name: N_FCU_ALTITUDE
    label: FCU altitude display
    class: observe
    group: fcu

  - name: I_OH_ELEC_APU_MASTER_L
    label: APU MASTER light
    class: observe
    group: overhead

  # Test data: MASTER CAUTION is an edge push button like every other (no special case any more).
  - name: S_MIP_MASTER_CAUTION_CAPT
    label: Master caution
    class: pulse
    group: mip
    press: edge

  # Test data: a key with an effect lamp that toggles on each press (CRO-26 effect comparison).
  - name: S_FCU_EFIS1_FD
    label: FD
    class: pulse
    group: efis
    press: edge
    verify: { lvar: I_FCU_EFIS1_FD, settle_ms: 150 } # longer than the fake lamp lag (110 ms), as in the real profile

  - name: I_FCU_EFIS1_FD
    label: FD light
    class: observe
    group: efis

  # Test data (CRO-27): a latching push button that Fenix counts, as in the real profile
  # (gate test 1: ELEC PUMP 1…28, press and release each +1).
  - name: S_OH_HYD_YELLOW_ELEC_PUMP
    label: YELLOW ELEC PUMP
    class: pulse
    group: overhead
    press: edge
    verify: { lvar: I_OH_HYD_YELLOW_ELEC_PUMP_L, settle_ms: 150 }

  - name: I_OH_HYD_YELLOW_ELEC_PUMP_L
    label: YELLOW ELEC PUMP light
    class: observe
    group: overhead

  # Test data (CRO-27): an analog knob with its range from gate test 1 and no GraphQL check
  # (confirmed by read-back of its own L: var).
  - name: A_OH_PNEUMATIC_LDG_ELEV
    label: LDG ELEV
    class: analog
    group: overhead
    range: [-3, 7]

  # Test data: an encoder with no display var (verified by read-back only).
  - name: E_MIP_CLOCK_SET
    label: Clock set
    class: delta
    group: mip

  # Test data (CRO-29/30): a hold button. Its lamp comes on only after ~1 s held (observe-report.md).
  - name: S_OH_FIRE_ENG1_TEST
    label: ENG 1 FIRE TEST
    class: pulse
    group: overhead
    press: edge

  # Sidestick takeover pushbuttons (see roles.takeover): edge push buttons like every other.
  - name: S_FC_CAPT_INST_DISCONNECT
    label: "Captain's takeover button"
    class: pulse
    group: flightcontrols
    press: edge

  - name: S_FC_FO_INST_DISCONNECT
    label: "First officer's takeover button"
    class: pulse
    group: flightcontrols
    press: edge

  # Spring-loaded rotary: springs back to 1. A position Crosscheck wrote is returned to rest if its
  # release never arrives (protocol.md section 5).
  - name: S_FC_RUDDER_TRIM
    label: RUD TRIM
    value_labels: { "0": L, "1": neutral, "2": R }
    class: verified
    group: flightcontrols
    values: [0, 1, 2]
    rest: 1

  # Indicators of an input that is not synced: compared as inputs (red), one line per knob.
  - name: I_FCU_SPEED_MANAGED
    label: SPD managed
    class: observe
    group: fcu
    alarm: { text: "SPD managed differs between the cockpits – push or pull the knob in the cockpit that is wrong.", as: I_FCU_SPEED_MANAGED }

  - name: B_FCU_SPEED_DASHED
    class: observe
    group: fcu
    alarm: { text: "SPD managed differs between the cockpits – push or pull the knob in the cockpit that is wrong.", as: I_FCU_SPEED_MANAGED }

datarefs:
  # Name confirmed in spike/VarTypes/GRAPHQL.md ("fuel per tank").
  - path: aircraft.fuel.left.amount.kg
    label: Left tank fuel
    unit: kg
    drift_warn: 100
    class: owned
    group: systems
    poll_hz: 1

roles:
  # A press on the pilot monitoring's own seat = "I have control" (control_request).
  # TODO(CRO-8): confirm these are the takeover pushbuttons, against the scan and in the sim.
  takeover: { captain: S_FC_CAPT_INST_DISCONNECT, fo: S_FC_FO_INST_DISCONNECT }
